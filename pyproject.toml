[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macbeth-game"
version = "0.1.0"
description = "Local-first Macbeth narrative game with SQLite persistence and local RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.3"]
rag = ["PyMuPDF>=1.24,<2.0", "faiss-cpu>=1.8", "numpy>=1.26"]

[project.scripts]
macbeth-ingest = "macbeth_game.rag.cli:ingest_main"
macbeth-build-index = "macbeth_game.rag.cli:build_index_main"
macbeth-search = "macbeth_game.rag.cli:search_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=macbeth_game --cov-report=term-missing"

[tool.ruff]
src = ["src"]
line-length = 100
